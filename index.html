<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭕</text></svg>" />
<title>Tic-Tac-Toe</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273549;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --x: #38bdf8;
    --o: #fb7185;
    --win: #22c55e;
    --win-bg: rgba(34, 197, 94, 0.22);
    --border: #334155;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100dvh;
    background: radial-gradient(1200px 600px at 50% -10%, #1e3a5f 0%, var(--bg) 55%) fixed, var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px 32px;
  }
  main.card {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 22px 20px 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  header { text-align: center; margin-bottom: 12px; }
  h1 {
    margin: 0;
    font-size: 1.5rem;
    letter-spacing: .02em;
  }
  p.sub { margin: 6px 0 0; color: var(--muted); font-size: .9rem; }
  .scorebar {
    display: flex;
    gap: 8px;
    margin: 16px 0 12px;
  }
  .score {
    flex: 1;
    background: #0b1220;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 6px;
    text-align: center;
    transition: border-color .2s, box-shadow .2s;
  }
  .score.active-x { border-color: var(--x); box-shadow: 0 0 0 1px var(--x); }
  .score.active-o { border-color: var(--o); box-shadow: 0 0 0 1px var(--o); }
  .score .label { font-size: .78rem; color: var(--muted); font-weight: 700; letter-spacing: .08em; }
  .score .value { font-size: 1.35rem; font-weight: 800; line-height: 1.2; }
  .score-x .value { color: var(--x); }
  .score-o .value { color: var(--o); }
  .score-d .value { color: var(--text); }
  #status {
    min-height: 3rem;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 1.15rem;
    font-weight: 800;
    background: #0b1220;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 12px;
    margin: 0 0 14px;
  }
  #status .x-turn { color: var(--x); }
  #status .o-turn { color: var(--o); }
  #status .win-text { color: var(--win); }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    touch-action: manipulation;
  }
  .cell {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    border-radius: var(--radius);
    aspect-ratio: 1 / 1;
    min-height: 88px;
    font-size: clamp(2.4rem, 14vw, 3.4rem);
    font-weight: 900;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .06s ease, background .15s, border-color .15s;
    user-select: none;
  }
  @media (pointer: coarse) {
    .cell { min-height: 96px; }
  }
  .cell:not(:disabled):active { transform: scale(.96); }
  .cell:focus-visible {
    outline: 3px solid #93c5fd;
    outline-offset: 2px;
  }
  .cell.x { color: var(--x); }
  .cell.o { color: var(--o); }
  .cell.win {
    background: var(--win-bg);
    border-color: var(--win);
    box-shadow: 0 0 0 2px var(--win), 0 0 22px rgba(34,197,94,.45);
    animation: pop .35s ease;
  }
  @keyframes pop {
    0% { transform: scale(.94); }
    55% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  .controls {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  button.action {
    flex: 1;
    min-height: 56px;
    border-radius: 16px;
    border: 1px solid var(--border);
    font-size: 1.05rem;
    font-weight: 800;
    cursor: pointer;
    color: #06121f;
    background: linear-gradient(180deg, #7dd3fc, #38bdf8);
  }
  button.action:active { transform: scale(.98); }
  button.action.secondary {
    background: #0b1220;
    color: var(--text);
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: .8rem;
    margin-top: 12px;
  }
</style>
</head>
<body>
<main class="card">
  <header>
    <h1>Tic-Tac-Toe</h1>
    <p class="sub">Two local players &middot; X goes first</p>
  </header>

  <div class="scorebar" aria-label="Score">
    <div class="score score-x" id="scoreXBox"><div class="label">PLAYER X</div><div class="value" id="scoreX">0</div></div>
    <div class="score score-d" id="scoreDBox"><div class="label">DRAWS</div><div class="value" id="scoreD">0</div></div>
    <div class="score score-o" id="scoreOBox"><div class="label">PLAYER O</div><div class="value" id="scoreO">0</div></div>
  </div>

  <div id="status" role="status" aria-live="polite"></div>

  <div id="board" role="grid" aria-label="Tic-tac-toe board"></div>

  <div class="controls">
    <button class="action" id="restart" type="button">↻ Restart</button>
    <button class="action secondary" id="resetScore" type="button">Reset scores</button>
  </div>

  <footer>Tap a square to play. Responsive dark design, big touch targets.</footer>
</main>

<script>
(function () {
  "use strict";
  var WINS = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  var boardEl = document.getElementById("board");
  var statusEl = document.getElementById("status");
  var restartBtn = document.getElementById("restart");
  var resetScoreBtn = document.getElementById("resetScore");
  var scoreXEl = document.getElementById("scoreX");
  var scoreOEl = document.getElementById("scoreO");
  var scoreDEl = document.getElementById("scoreD");
  var scoreXBox = document.getElementById("scoreXBox");
  var scoreOBox = document.getElementById("scoreOBox");

  var cells = [];
  var squares = ["","","","","","","","",""];
  var current = "X";
  var gameOver = false;
  var scores = { X: 0, O: 0, D: 0 };

  // Build accessible buttons once (large touch targets).
  for (var i = 0; i < 9; i++) {
    (function (idx) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "cell";
      b.setAttribute("role", "gridcell");
      b.setAttribute("aria-label", "Cell " + (idx + 1) + ", empty");
      b.addEventListener("click", function () { play(idx); });
      boardEl.appendChild(b);
      cells.push(b);
    })(i);
  }

  function checkWinner(s) {
    for (var k = 0; k < WINS.length; k++) {
      var line = WINS[k];
      var a = s[line[0]], b = s[line[1]], c = s[line[2]];
      if (a !== "" && a === b && b === c) return { player: a, line: line };
    }
    return null;
  }

  function isDraw(s) {
    for (var i = 0; i < 9; i++) if (s[i] === "") return false;
    return checkWinner(s) === null;
  }

  function render(winLine) {
    for (var i = 0; i < 9; i++) {
      var v = squares[i];
      cells[i].textContent = v;
      cells[i].classList.toggle("x", v === "X");
      cells[i].classList.toggle("o", v === "O");
      cells[i].classList.toggle("win", !!winLine && winLine.indexOf(i) !== -1);
      cells[i].disabled = gameOver || v !== "";
      cells[i].setAttribute("aria-label",
        "Cell " + (i + 1) + ", " + (v === "" ? "empty" : v));
    }
  }

  function updateStatus(win) {
    scoreXEl.textContent = scores.X;
    scoreOEl.textContent = scores.O;
    scoreDEl.textContent = scores.D;
    scoreXBox.classList.toggle("active-x", !gameOver && current === "X");
    scoreOBox.classList.toggle("active-o", !gameOver && current === "O");
    if (win) {
      statusEl.innerHTML = '<span class="win-text">Player ' + win.player + ' wins! 🎉</span>';
    } else if (gameOver) {
      statusEl.textContent = "It's a draw! 🤝";
    } else if (current === "X") {
      statusEl.innerHTML = 'Player <span class="x-turn">X</span>\u2019s turn';
    } else {
      statusEl.innerHTML = 'Player <span class="o-turn">O</span>\u2019s turn';
    }
  }

  function play(idx) {
    if (gameOver || squares[idx] !== "") return;
    squares[idx] = current;
    var win = checkWinner(squares);
    if (win) {
      gameOver = true;
      scores[win.player]++;
      render(win.line);
      updateStatus(win);
      return;
    }
    if (isDraw(squares)) {
      gameOver = true;
      scores.D++;
      render(null);
      updateStatus(null);
      return;
    }
    current = (current === "X") ? "O" : "X";
    render(null);
    updateStatus(null);
  }

  function restart() {
    squares = ["","","","","","","","",""];
    current = "X";
    gameOver = false;
    render(null);
    updateStatus(null);
    // Keep focus usable for keyboard players.
    if (document.activeElement) document.activeElement.blur();
  }

  restartBtn.addEventListener("click", restart);
  resetScoreBtn.addEventListener("click", function () {
    scores = { X: 0, O: 0, D: 0 };
    restart();
  });

  // Expose a tiny test hook without polluting global scope much.
  window.__ttt = {
    play: play, restart: restart,
    state: function () {
      return { squares: squares.slice(), current: current, gameOver: gameOver, scores: {X: scores.X, O: scores.O, D: scores.D} };
    },
    checkWinner: checkWinner, isDraw: isDraw
  };

  restart();
})();
</script>
</body>
</html>
