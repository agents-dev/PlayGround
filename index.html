<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f2">
  <title>Daymark — make room for what matters</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
    :root{--ink:#20251f;--muted:#858a81;--line:#e9ebe5;--paper:#fff;--bg:#f5f6f2;--green:#496b4c;--soft:#edf2e9;--lime:#d9e9c8;--amber:#c38b45;--shadow:0 18px 60px #2835220b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer} .app{max-width:1080px;margin:0 auto;padding:30px 42px 56px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:55px}.brand{display:flex;align-items:center;gap:11px;font-family:Manrope,sans-serif;font-weight:800;font-size:19px;letter-spacing:-.7px}.brand-icon{width:34px;height:34px;border-radius:11px;background:var(--green);display:grid;place-items:center;color:#fff}.brand-icon svg{width:19px}.top-note{font-size:12px;color:#898e85;display:flex;align-items:center;gap:8px}.sun{color:#bd8d50;font-size:16px}
    .layout{display:grid;grid-template-columns:1fr 270px;gap:56px;align-items:start}.eyebrow{text-transform:uppercase;letter-spacing:1.7px;font-size:10px;font-weight:700;color:var(--green);margin:0 0 12px}.heading{font-family:Manrope,sans-serif;font-size:42px;line-height:1.14;letter-spacing:-1.9px;margin:0;font-weight:700}.heading em{font-style:normal;color:var(--green)}.intro{color:#82877e;margin:12px 0 29px;font-size:14px}.composer{height:58px;display:flex;align-items:center;padding:6px 7px 6px 17px;background:white;border:1px solid #e7e9e2;border-radius:13px;box-shadow:0 4px 20px #33300a08}.composer:focus-within{border-color:#a9bea2;box-shadow:0 0 0 3px #496b4c12}.plus{color:#86947e;font-size:21px;margin-right:12px;font-weight:400}.composer input{border:0;outline:0;flex:1;min-width:0;color:var(--ink);background:transparent;font-size:13px}.composer input::placeholder{color:#a1a59e}.add-btn{border:0;border-radius:9px;padding:11px 16px;background:var(--green);color:white;font-size:12px;font-weight:600;transition:background .2s,transform .2s}.add-btn:hover{background:#38593b;transform:translateY(-1px)}
    .list-head{margin:33px 0 13px;display:flex;align-items:center;justify-content:space-between}.list-title{font-family:Manrope,sans-serif;font-size:14px;font-weight:700}.count-pill{margin-left:7px;background:#e9eee5;color:#6d8069;padding:3px 7px;border-radius:20px;font-size:10px;font-weight:700}.filters{display:flex;align-items:center;gap:4px}.filter{border:0;background:transparent;color:#93988f;padding:7px 10px;border-radius:7px;font-size:11px;font-weight:600}.filter:hover{color:var(--ink)}.filter.active{background:white;color:var(--green);box-shadow:0 2px 8px #29351b0d}.task-list{background:white;border:1px solid #eaebe6;border-radius:13px;overflow:hidden;box-shadow:var(--shadow)}.task-row{display:flex;align-items:center;gap:13px;padding:16px 17px;border-bottom:1px solid #f0f1ed;min-height:62px;animation:arrive .2s ease}.task-row:last-child{border-bottom:0}@keyframes arrive{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}.check{width:19px;height:19px;flex:0 0 19px;border:1.5px solid #d3d8cf;border-radius:6px;background:white;display:grid;place-items:center;color:transparent;transition:.18s}.check:hover{border-color:var(--green);background:#f6f8f3}.check.done{background:var(--green);border-color:var(--green);color:white}.check svg{width:12px;height:12px}.task-label{flex:1;min-width:0;font-size:13px;line-height:1.45;overflow-wrap:anywhere}.task-label.done{text-decoration:line-through;color:#a8aca4}.task-actions{display:flex;align-items:center;gap:2px;opacity:0;transition:opacity .15s}.task-row:hover .task-actions,.task-row:focus-within .task-actions{opacity:1}.icon-btn{width:30px;height:30px;border:0;background:transparent;color:#a0a59c;border-radius:7px;display:grid;place-items:center}.icon-btn:hover{background:#f2f4ef;color:var(--green)}.icon-btn.delete:hover{background:#fbefed;color:#bb6558}.icon-btn svg{width:15px;height:15px}.edit-input{flex:1;min-width:0;border:1px solid #cbd7c5;border-radius:6px;padding:7px 9px;outline:0}.empty{padding:43px 20px;text-align:center;color:#91968d}.empty-icon{width:42px;height:42px;border-radius:14px;background:#f2f5ee;color:#81967c;margin:0 auto 13px;display:grid;place-items:center;font-size:20px}.empty strong{display:block;color:#50594d;font-family:Manrope,sans-serif;font-size:13px;margin-bottom:5px}.empty span{font-size:12px}
    .side{padding-top:31px}.date-card{background:#eaf0e6;border-radius:16px;padding:22px 22px 20px;position:relative;overflow:hidden}.date-card:after{content:'';position:absolute;width:120px;height:120px;border:1px solid #dce6d6;border-radius:50%;right:-43px;top:-55px}.date-kicker{font-size:10px;letter-spacing:1.3px;font-weight:700;text-transform:uppercase;color:#788c72}.date-number{font-family:Manrope,sans-serif;font-size:48px;line-height:1.1;font-weight:700;letter-spacing:-2px;margin:11px 0 1px;color:#334b35}.date-month{font-size:13px;font-weight:600;color:#516a50}.date-weekday{font-size:11px;color:#879381;margin-top:12px}.progress-card{padding:22px 4px 20px;border-bottom:1px solid #e4e7df}.progress-top{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600}.progress-value{font-family:Manrope,sans-serif;color:var(--green);font-size:20px;font-weight:700}.progress-track{height:6px;border-radius:9px;background:#e5e9e1;margin:13px 0 9px;overflow:hidden}.progress-bar{height:100%;background:#77966d;border-radius:9px;transition:width .3s}.progress-note{font-size:10px;color:#90958c}.quote{padding:21px 5px;color:#777e73;font-size:12px;line-height:1.65}.quote-mark{font-family:Georgia,serif;font-size:26px;line-height:1;color:#9bad91;margin-bottom:7px}.quote strong{display:block;color:#66735f;font-weight:600;margin-top:9px;font-size:10px}
    .footer{margin-top:16px;display:flex;justify-content:space-between;align-items:center;color:#9a9e96;font-size:10px}.clear-btn{border:0;background:none;color:#91968d;font-size:10px;padding:6px 0}.clear-btn:hover{color:#b76053}.keyboard-hint{display:flex;align-items:center;gap:5px}.kbd{border:1px solid #e4e6e0;background:#fafbf9;border-radius:4px;padding:2px 5px;font-size:9px;color:#858b81}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,15px);padding:10px 16px;background:#26362a;color:white;border-radius:9px;font-size:12px;opacity:0;pointer-events:none;transition:.22s;box-shadow:0 8px 25px #0002}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:760px){.app{padding:23px 22px 40px}.topbar{margin-bottom:39px}.layout{grid-template-columns:1fr;gap:25px}.heading{font-size:37px}.side{padding-top:0;display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.date-card{grid-row:span 2}.progress-card{padding-top:5px}.quote{padding-top:14px}.top-note{font-size:11px}}
    @media(max-width:480px){.app{padding:20px 16px 32px}.topbar{margin-bottom:34px}.top-note{display:none}.heading{font-size:33px;letter-spacing:-1.4px}.intro{font-size:13px;margin-bottom:22px}.composer{height:55px;padding-left:13px}.add-btn{padding:10px 13px}.list-head{margin-top:27px;align-items:flex-start;gap:8px;flex-direction:column}.filters{margin-left:-7px}.filter{padding:7px 9px}.task-row{padding:14px 12px;gap:10px}.task-actions{opacity:1}.icon-btn{width:28px}.side{grid-template-columns:1fr 1.15fr;gap:0 15px}.date-card{padding:17px}.date-number{font-size:41px}.footer{gap:8px}.keyboard-hint{display:none}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar"><div class="brand"><span class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg></span>daymark</div><div class="top-note"><span class="sun">✳</span> A little progress goes a long way</div></header>
    <main class="layout"><section class="main-column"><p class="eyebrow">A fresh start, every day</p><h1 class="heading">Make room for<br><em>what matters.</em></h1><p class="intro">One thing at a time. You’ve got this.</p>
      <form class="composer" id="task-form"><span class="plus">＋</span><input id="task-input" autocomplete="off" maxlength="180" aria-label="New task" placeholder="What would you like to get done?"><button class="add-btn" type="submit">Add task <span aria-hidden="true">↗</span></button></form>
      <div class="list-head"><div class="list-title">Your tasks <span class="count-pill" id="task-count">0</span></div><nav class="filters" aria-label="Filter tasks"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="active">In progress</button><button class="filter" data-filter="completed">Completed</button></nav></div>
      <div class="task-list" id="task-list" aria-live="polite"></div><div class="footer"><button class="clear-btn" id="clear-completed">Clear completed</button><span class="keyboard-hint"><span class="kbd">Enter</span> to add a task</span></div>
    </section><aside class="side" aria-label="Daily summary"><div class="date-card"><div class="date-kicker">Today is</div><div class="date-number" id="date-number"></div><div class="date-month" id="date-month"></div><div class="date-weekday" id="date-weekday"></div></div><div class="progress-card"><div class="progress-top"><span>Daily progress</span><span class="progress-value" id="progress-value">0%</span></div><div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div><div class="progress-note" id="progress-note">A small step is still a step.</div></div><div class="quote"><div class="quote-mark">“</div>Focus on being productive instead of busy.<strong>— Tim Ferriss</strong></div></aside></main>
  </div><div class="toast" id="toast" role="status"></div>
  <script>
    (()=>{
      const KEY='daymark.tasks.v1';let tasks=[];let filter='all';let toastTimer;
      const list=document.querySelector('#task-list'),form=document.querySelector('#task-form'),input=document.querySelector('#task-input');
      const icons={edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m16 4 4 4L9 19l-5 1 1-5Z"/><path d="m14 6 4 4"/></svg>',delete:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6m4-6v6M5 7l1 13h12l1-13M9 7V4h6v3"/></svg>',check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>'};
      function load(){try{const parsed=JSON.parse(localStorage.getItem(KEY)||'[]');tasks=Array.isArray(parsed)?parsed.filter(t=>t&&typeof t.text==='string'&&typeof t.id==='string').map(t=>({id:t.id,text:t.text,done:!!t.done,created:t.created||Date.now()})):[]}catch{tasks=[]}}
      function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch{notify('Could not save tasks in this browser.')}}
      function notify(text){const el=document.querySelector('#toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1900)}
      function render(){const visible=tasks.filter(t=>filter==='all'||(filter==='active'?!t.done:t.done));list.innerHTML='';document.querySelector('#task-count').textContent=tasks.filter(t=>!t.done).length;
        if(!visible.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML=tasks.length?'<div class="empty-icon">✓</div><strong>Nothing here right now</strong><span>Try another filter to see your tasks.</span>':'<div class="empty-icon">✳</div><strong>A clear space to begin</strong><span>Add a task above and make today yours.</span>';list.append(empty)}
        visible.forEach(task=>{const row=document.createElement('div');row.className='task-row';const check=document.createElement('button');check.className='check'+(task.done?' done':'');check.setAttribute('aria-label',task.done?'Mark as in progress':'Complete task');check.setAttribute('aria-pressed',String(task.done));check.innerHTML=icons.check;check.addEventListener('click',()=>{task.done=!task.done;save();render();notify(task.done?'Nicely done!':'Task back in progress')});const label=document.createElement('span');label.className='task-label'+(task.done?' done':'');label.textContent=task.text;const actions=document.createElement('div');actions.className='task-actions';const edit=document.createElement('button');edit.className='icon-btn';edit.setAttribute('aria-label','Edit task');edit.innerHTML=icons.edit;edit.addEventListener('click',()=>beginEdit(row,task));const del=document.createElement('button');del.className='icon-btn delete';del.setAttribute('aria-label','Delete task');del.innerHTML=icons.delete;del.addEventListener('click',()=>{tasks=tasks.filter(t=>t.id!==task.id);save();render();notify('Task deleted')});actions.append(edit,del);row.append(check,label,actions);list.append(row)});
        const completed=tasks.filter(t=>t.done).length,pct=tasks.length?Math.round(completed/tasks.length*100):0;document.querySelector('#progress-value').textContent=pct+'%';document.querySelector('#progress-bar').style.width=pct+'%';document.querySelector('#progress-note').textContent=tasks.length?(pct===100?'Everything on your list is done.':`${completed} of ${tasks.length} ${tasks.length===1?'task':'tasks'} completed`):'A small step is still a step.';
      }
      function beginEdit(row,task){const editor=document.createElement('input');editor.className='edit-input';editor.maxLength=180;editor.value=task.text;editor.setAttribute('aria-label','Edit task');const label=row.querySelector('.task-label');label.replaceWith(editor);row.querySelector('.task-actions').style.opacity='1';editor.focus();editor.select();const finish=saveEdit=>{if(saveEdit&&editor.value.trim()){task.text=editor.value.trim();save();notify('Task updated')}render()};editor.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();finish(true)}if(e.key==='Escape')finish(false)});editor.addEventListener('blur',()=>finish(true),{once:true})}
      form.addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text){input.focus();return}tasks.unshift({id:globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2),text,done:false,created:Date.now()});save();filter='all';document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter==='all'));input.value='';render();input.focus();notify('Task added')});
      document.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{filter=button.dataset.filter;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b===button));render()}));
      document.querySelector('#clear-completed').addEventListener('click',()=>{const n=tasks.filter(t=>t.done).length;if(!n){notify('No completed tasks to clear');return}tasks=tasks.filter(t=>!t.done);save();render();notify(`${n} completed ${n===1?'task':'tasks'} cleared`)});
      const now=new Date();document.querySelector('#date-number').textContent=new Intl.DateTimeFormat('en',{day:'numeric'}).format(now);document.querySelector('#date-month').textContent=new Intl.DateTimeFormat('en',{month:'long',year:'numeric'}).format(now);document.querySelector('#date-weekday').textContent=new Intl.DateTimeFormat('en',{weekday:'long'}).format(now);
      load();render();
    })();
  </script>
</body>
</html>
